<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iTerm2 Profile Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <form method="post" action="/export">
        <fieldset>
            <legend>Geral</legend>
            <label>
                Nome
                <input type="text" name="name" value="{{ d.name }}" required>
            </label>
            <label>
                Fonte
                <input type="text" name="font" value="{{ d.font }}">
            </label>
            <label>
                Tamanho
                <input type="number" name="size" value="{{ d.size }}" min="6" max="72">
            </label>
            <label>
                Colunas
                <input type="number" name="columns" value="{{ d.columns }}" min="10">
            </label>
            <label>
                Linhas
                <input type="number" name="rows" value="{{ d.rows }}" min="5">
            </label>
            <label>
                Transparência (%)
                <input type="number" name="transparency" value="{{ d.transparency }}" min="0" max="100">
            </label>
            <label>
                Blur
                <input type="checkbox" name="blur" {{ 'checked' if d.blur }}>
            </label>
            <label>
                Cursor
                <select name="cursor">
                    {% for key, label in cursors.items() %}
                    <option value="{{ key }}" {{ 'selected' if key == d.cursor }}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                Cursor piscando
                <input type="checkbox" name="blink" {{ 'checked' if d.blink }}>
            </label>
            <label>
                Scrollback
                <input type="number" name="scrollback" value="{{ d.scrollback }}" min="0">
            </label>
            <label>
                Scrollback ilimitado
                <input type="checkbox" name="unlimited" {{ 'checked' if d.unlimited }}>
            </label>
        </fieldset>

        <fieldset>
            <legend>Tema ZSH</legend>
            <label>
                Pasta
                <input type="text" id="themes-dir" value="{{ themes_dir }}">
            </label>
            <label>
                Tema
                <select id="theme">
                    <option value="">(nenhum)</option>
                </select>
            </label>
        </fieldset>

        <fieldset>
            <legend>Cores</legend>
            <div class="grid">
                {% for key, value in d.colors.items() %}
                <label>
                    {{ key.replace(' Color', '') }}
                    <input type="color" name="{{ key }}" value="{{ value }}">
                </label>
                {% endfor %}
            </div>
        </fieldset>

        <button type="submit">Gerar perfil JSON</button>
    </form>

    <div id="preview"></div>

    <script>
        const form = document.forms[0];
        const preview = document.getElementById("preview");
        const value = name => form.elements[name].value;

        const fg = (index, text) =>
            `<span style="color: ${value(`Ansi ${index} Color`)}">${text}</span>`;

        const palette = offset =>
            [...Array(8)]
                .map((_, i) => `<span style="background: ${value(`Ansi ${i + offset} Color`)}">   </span>`)
                .join("");

        const themesDir = document.getElementById("themes-dir");
        const themeSelect = document.getElementById("theme");
        let themePrompt = null;

        const escape = text => text.replace(/[&<>"]/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[ch]);
        const color = c => typeof c === "number" ? value(`Ansi ${c} Color`) : c;

        function prompt() {
            if (!themePrompt) return `${fg(2, "user@host")}:${fg(4, "~/projetos")}$ `;
            return themePrompt.map(s => {
                const css = [];
                const fgColor = s.fg !== null ? color(s.fg) : (s.bold ? value("Bold Color") : null);
                if (fgColor) css.push(`color: ${fgColor}`);
                if (s.bg !== null) css.push(`background: ${color(s.bg)}`);
                if (s.bold) css.push("font-weight: bold");
                if (s.underline) css.push("text-decoration: underline");
                return css.length ? `<span style="${css.join("; ")}">${escape(s.text)}</span>` : escape(s.text);
            }).join("");
        }

        async function loadThemes() {
            let saved = null;
            try { saved = localStorage.getItem("theme"); } catch {}
            const names = await (await fetch(`/themes?dir=${encodeURIComponent(themesDir.value)}`)).json();
            themeSelect.innerHTML = '<option value="">(nenhum)</option>' +
                names.map(n => `<option ${n === saved ? "selected" : ""}>${escape(n)}</option>`).join("");
            await loadTheme();
        }

        async function loadTheme() {
            const name = themeSelect.value;
            try { localStorage.setItem("theme", name); localStorage.setItem("themesDir", themesDir.value); } catch {}
            themePrompt = null;
            if (name) {
                const res = await fetch(`/themes/${encodeURIComponent(name)}?dir=${encodeURIComponent(themesDir.value)}`);
                if (res.ok) themePrompt = (await res.json()).prompt;
            }
            render();
        }

        function render() {
            preview.style.background = value("Background Color");
            preview.style.color = value("Foreground Color");
            preview.style.fontFamily = `"${value("font")}", monospace`;
            preview.style.opacity = 1 - value("transparency") / 100;

            preview.innerHTML = [
                `${prompt()}ls -la`,
                `${fg(12, "drwxr-xr-x")}  ${fg(6, "src")}`,
                `${fg(1, "error:")} algo falhou`,
                `${fg(3, "warning:")} atenção`,
                `<a style="color: ${value("Link Color")}">https://iterm2.com</a>`,
                `<span style="background: ${value("Selection Color")}; color: ${value("Selected Text Color")}">texto selecionado</span>`,
                "",
                palette(0),
                palette(8),
                "",
                `${prompt()}<span style="background: ${value("Cursor Color")}; color: ${value("Cursor Text Color")}">_</span>`,
            ].join("\n");
        }

        form.addEventListener("input", render);
        themesDir.addEventListener("change", loadThemes);
        themeSelect.addEventListener("change", loadTheme);
        try { themesDir.value = localStorage.getItem("themesDir") || themesDir.value; } catch {}
        render();
        loadThemes();
    </script>
</body>
</html>
